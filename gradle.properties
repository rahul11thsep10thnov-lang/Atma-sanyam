# Memory for Gradle itself. Because the Kotlin compiler runs inside Gradle (see below), this also
# covers compiling. Lower to -Xmx2048m if your PC has only 4 GB of RAM; raise if builds run out of memory.
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Run the Kotlin compiler inside the Gradle process instead of a separate "Kotlin daemon".
# Avoids "Daemon compilation failed: Could not connect to Kotlin compile daemon" on low-memory or
# antivirus-restricted Windows PCs.
kotlin.compiler.execution.strategy=in-process

name: Unreal Combat core

# Builds and tests the engine-independent rules core. The Unreal modules themselves
# need an Unreal Engine build machine and are not compiled here.
on:
  push:
    branches: [main]
    paths: ['UnrealCombat/**', '.github/workflows/unreal-combat-core.yml']
  pull_request:
    paths: ['UnrealCombat/**', '.github/workflows/unreal-combat-core.yml']

jobs:
  core-tests:
    name: Rules core (headless tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S UnrealCombat/CoreTests -B build -DCMAKE_CXX_COMPILER=clang++
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

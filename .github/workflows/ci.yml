name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (API + Postgres tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: focus
          POSTGRES_PASSWORD: focus-ci
          POSTGRES_DB: focus_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U focus" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgres://focus:focus-ci@localhost:5432/focus_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run engines:check # the server replays the app's real game code; fails if the bundle is stale
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  admin:
    name: Admin console (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm run build

  app:
    name: App (typecheck + game tests + Android/iOS/web bundles)
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_PUBLIC_API_URL: https://api.example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Remaining findings are inside Expo's own build tooling (fixed only by Expo 58), so only critical ones fail the build.
      - run: npm audit --audit-level=critical
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test # includes the Hindi translation check (tests/i18n.test.ts)
      - run: npx expo export --platform android --platform ios --platform web --output-dir /tmp/expo-export

name: Android Build

# Builds the app on every push/PR so a real, installable debug APK is always available
# from the Actions run's Artifacts section - no local Android Studio or SDK needed.
#
# ubuntu-latest runners ship with an Android SDK cmdline-tools install already at
# $ANDROID_HOME (see actions/runner-images); we reuse that instead of a third-party
# "setup Android SDK" action, since more than one of those has proven unreliable
# against current Google package repositories.
on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept SDK licenses and install platform/build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests (core:model)
        run: ./gradlew :core:model:test --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: atma-sanyam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: core/model/build/reports/tests/
          if-no-files-found: ignore

name: Chibi Story Engine

on:
  push:
    branches: [main]
    paths: ['chibi-story-engine/**', '.github/workflows/chibi-engine.yml']
  pull_request:
    paths: ['chibi-story-engine/**', '.github/workflows/chibi-engine.yml']

concurrency:
  group: chibi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Engine + backend (pytest, real renders at preview size)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: csae
          POSTGRES_PASSWORD: csae-dev
          POSTGRES_DB: csae_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U csae" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: chibi-story-engine
    env:
      CSAE_TEST_DATABASE_URL: postgresql+psycopg://csae:csae-dev@localhost:5432/csae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng fonts-noto-core libegl1 libgl1 libxrender1 libxi6 libxkbcommon0 libsm6 libxfixes3 libxxf86vm1
      - run: pip install -e ".[render,backend,forge,llm,dev]"
      - run: python -m pytest

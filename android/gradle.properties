org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Low-memory-machine friendly settings: run one task/worker at a time instead
# of several in parallel. Slower, but avoids AAPT2/dexer subprocesses being
# starved of RAM and crashing mid-task on machines with limited RAM (e.g.
# "Can not extract resource from com.android.aaptcompiler.ParsedResource...").
org.gradle.parallel=false
org.gradle.workers.max=1
android.aapt2.pool.size=1

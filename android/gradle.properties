org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Low-memory-machine friendly settings: run one task/worker at a time instead
# of several in parallel. Slower, but avoids AAPT2/dexer subprocesses being
# starved of RAM and crashing mid-task on machines with limited RAM (e.g.
# "Can not extract resource from com.android.aaptcompiler.ParsedResource...").
org.gradle.parallel=false
org.gradle.workers.max=1
android.aapt2.pool.size=1

# The Kotlin compiler normally runs in its own background "daemon" process
# for speed. On memory-constrained machines that daemon can fail to start
# or get killed under memory pressure, causing "Could not connect to
# Kotlin compile daemon". Running compilation in-process (inside the
# Gradle daemon itself) avoids that extra process entirely — slower, but
# far more reliable here.
kotlin.compiler.execution.strategy=in-process
